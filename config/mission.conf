# Mission / controller configuration (key = value). Defaults: include/altctl/config.hpp
# Override single values on the command line: --set key=value

connection_url = udpin://0.0.0.0:14551

# Mission
alt_high_m = 10.0
alt_low_m = 5.0
hold_time_s = 5.0
settle_tolerance_m = 0.25
settle_time_s = 2.0
state_timeout_s = 60.0

# Setpoint trajectory (trapezoidal) + outer loop: altitude error [m] -> climb-rate setpoint [m/s]
alt_kp = 2.0
max_climb_mps = 2.5
max_descent_mps = 1.5
setpoint_speed_up_mps = 1.5
setpoint_speed_down_mps = 1.0
setpoint_accel_mps2 = 0.7

# Inner loop: climb-rate error [m/s] -> thrust correction around MOT_THST_HOVER
# Tuned in SITL: vel_kp limit cycle at ~2.0 -> 0.7 (~3x margin); D made overshoot worse -> 0
vel_kp = 0.7
vel_ki = 0.15
vel_kd = 0.0
vel_d_cutoff_hz = 5.0
vel_i_limit = 0.15
vel_out_min = -0.3
vel_out_max = 0.3
thrust_min = 0.10
thrust_max = 0.80
liftoff_alt_m = 0.3
takeoff_thrust_margin = 0.10

# Command stream
control_rate_hz = 50.0
stream_watchdog_s = 0.5

log_path = logs/flight.csv
